<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07111f"/>
      <stop offset="55%" stop-color="#0b2440"/>
      <stop offset="100%" stop-color="#123d68"/>
    </linearGradient>

    <linearGradient id="blue" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#38a8ff"/>
      <stop offset="100%" stop-color="#8be5ff"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <circle
    cx="256"
    cy="256"
    r="190"
    fill="none"
    stroke="#1f527d"
    stroke-width="3"
    opacity="0.55"
  />

  <path
    d="M105 327
       L155 277
       L202 302
       L260 210
       L308 245
       L407 135"
    fill="none"
    stroke="url(#blue)"
    stroke-width="28"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#glow)"
  />

  <path
    d="M105 327
       L155 277
       L202 302
       L260 210
       L308 245
       L407 135"
    fill="none"
    stroke="white"
    stroke-width="8"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <circle cx="105" cy="327" r="12" fill="#8be5ff"/>
  <circle cx="155" cy="277" r="12" fill="#8be5ff"/>
  <circle cx="202" cy="302" r="12" fill="#8be5ff"/>
  <circle cx="260" cy="210" r="12" fill="#8be5ff"/>
  <circle cx="308" cy="245" r="12" fill="#8be5ff"/>
  <circle cx="407" cy="135" r="15" fill="white"/>

  <text
    x="256"
    y="405"
    text-anchor="middle"
    fill="white"
    font-family="Arial, Helvetica, sans-serif"
    font-size="58"
    font-weight="900"
    letter-spacing="4"
  >SA</text>
</svg>
